spring:
  application:
    name: dcontrol
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  mail:
    host: ${DCONTROL_MAIL_HOST:localhost}
    port: ${DCONTROL_MAIL_PORT:1025}
    username: ${DCONTROL_MAIL_USERNAME:}
    password: ${DCONTROL_MAIL_PASSWORD:}
  docker:
    compose:
      enabled: false

server:
  shutdown: graceful
  error:
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

dcontrol:
  public-base-url: ${DCONTROL_PUBLIC_BASE_URL}
  web-base-url: ${DCONTROL_WEB_BASE_URL:${dcontrol.public-base-url}}
  jwt:
    secret: ${DCONTROL_JWT_SECRET}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    email-verification-ttl: 24h
    password-reset-ttl: 1h
  mail:
    from: ${DCONTROL_MAIL_FROM:dcontrol <no-reply@dcontrol.local>}
  pairing:
    token-ttl: 3m
  ws:
    command-timeout: 15s
    heartbeat-interval: 30s
    offline-after: 75s
    hello-timeout: 10s
    status-persist-interval: 5m
    ticket-ttl: 30s
    max-message-bytes: 65536
    allowed-origins: []
  cookie:
    secure: true
  storage:
    dir: ${DCONTROL_STORAGE_DIR}
  transfers:
    max-file-size: 4GB
    max-chunk-size: 16MB
    account-quota: 10GB
    max-active-per-device: 3
    stall-timeout: 15m
    ready-ttl: 1h
    spool-retention: 10m
    row-retention: 7d
    ticket-ttl: 60s
  sms:
    send-per-minute: 10
  calls:
    place-per-minute: 3
  blobs:
    max-size: 256KB
    timeout: 20s
  webrtc:
    # {host} is the host each socket connected to (localhost for the browser, 10.0.2.2 for the emulator).
    ice-servers:
      - urls: ["stun:{host}:3478"]
        turn: false
      - urls: ["turn:{host}:3478?transport=udp", "turn:{host}:3478?transport=tcp"]
        turn: true
    turn-secret: ${DCONTROL_TURN_SECRET:}
    credential-ttl: 12h
    consent-timeout: 60s
    start-per-minute: 6
  find:
    ring-per-minute: 10
    lock-per-minute: 5
